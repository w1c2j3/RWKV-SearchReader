limit_req_zone $http_authorization zone=poll:10m rate=5r/s;
server {
    listen 80;
    client_max_body_size 512k;
    location ~ ^/v1/jobs(?:/[a-f0-9]{32})?$ {
        limit_req zone=poll burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8790;
        proxy_set_header Host $host;
    }
    location ~ ^/v1/jobs/[a-f0-9]{32}/events$ {
        limit_req zone=poll burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8790;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
    }
    location = /v1/search/decision {
        limit_req zone=poll burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8790;
    }
    location = /healthz { proxy_pass http://api:8790; }
    location / { return 404; }
}
