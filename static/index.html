<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>问答助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        --page: #ffffff;
        --sidebar: #171717;
        --sidebar-hover: #2a2a2a;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --soft: #f4f4f4;
        --accent: #111827;
        --reader: #0f766e;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--page); color: var(--text); }
      button, textarea { font: inherit; }
      button { cursor: pointer; }

      .app-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        height: 100dvh;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 14px 12px;
        background: var(--sidebar);
        color: #f9fafb;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 42px;
        padding: 0 8px 13px;
        font-size: 14px;
        font-weight: 650;
      }

      .brand-mark, .assistant-avatar {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--reader);
        color: white;
        font-weight: 750;
      }

      .new-chat {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        background: transparent;
        color: #f9fafb;
        text-align: left;
      }

      .new-chat:hover { background: var(--sidebar-hover); }
      .plus { font-size: 22px; font-weight: 300; line-height: 1; }
      .sidebar-label { margin: 22px 10px 8px; color: #9ca3af; font-size: 12px; }

      .history-item {
        width: 100%;
        overflow: hidden;
        padding: 10px 12px;
        border: 0;
        border-radius: 9px;
        background: var(--sidebar-hover);
        color: #f3f4f6;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 13px 10px 4px;
        border-top: 1px solid #303030;
        color: #9ca3af;
        font-size: 12px;
        line-height: 1.5;
      }

      .chat-panel {
        position: relative;
        display: flex;
        min-width: 0;
        height: 100dvh;
        overflow: hidden;
        flex-direction: column;
        background: var(--page);
      }

      .topbar {
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 58px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgb(255 255 255 / 92%);
        backdrop-filter: blur(12px);
      }

      .topbar-title { font-size: 15px; font-weight: 650; }
      .online { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      .mobile-new { display: none; border: 0; background: transparent; color: var(--text); font-size: 22px; }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-behavior: smooth;
      }

      .conversation {
        width: min(820px, calc(100% - 32px));
        min-height: 100%;
        margin: 0 auto;
        padding: 36px 0 190px;
      }

      .welcome {
        display: grid;
        min-height: calc(100dvh - 285px);
        place-content: center;
        text-align: center;
      }

      .welcome-mark {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        margin: 0 auto 18px;
        border-radius: 15px;
        background: var(--reader);
        color: white;
        font-size: 20px;
        font-weight: 750;
        box-shadow: 0 10px 30px rgb(15 118 110 / 18%);
      }

      .welcome h1 { margin: 0; color: #111827; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.035em; }
      .welcome p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: min(570px, 100%);
        margin: 28px auto 0;
      }

      .suggestion {
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: #374151;
        text-align: left;
        line-height: 1.45;
      }

      .suggestion:hover { border-color: #c7cbd1; background: #fafafa; }

      .message { display: flex; gap: 13px; margin: 0 0 30px; }
      .message.user { justify-content: flex-end; }

      .user-bubble {
        max-width: min(74%, 640px);
        padding: 11px 16px;
        border-radius: 20px 20px 5px 20px;
        background: var(--soft);
        color: #202123;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .assistant-avatar { margin-top: 1px; width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
      .assistant-body { min-width: 0; max-width: calc(100% - 41px); flex: 1; }

      .assistant-answer {
        color: #202123;
        font-size: 15px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message-meta { margin-top: 10px; color: #9ca3af; font-size: 12px; }

      .source-details { margin-top: 13px; }
      .source-details summary { width: fit-content; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
      .source-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .source-link {
        max-width: 100%;
        overflow: hidden;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #4b5563;
        font-size: 12px;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source-link:hover { background: #f9fafb; color: #111827; }

      .progress-card { width: min(460px, 100%); padding: 2px 0 4px; }
      .progress-title { display: flex; align-items: center; gap: 9px; color: #374151; font-weight: 600; }
      .progress-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #d1d5db;
        border-top-color: var(--reader);
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      .progress-list { display: grid; gap: 7px; margin: 12px 0 0; padding: 0; list-style: none; }
      .progress-step { display: flex; align-items: center; gap: 9px; color: #9ca3af; font-size: 13px; }
      .progress-step.active { color: #374151; }
      .progress-step.done { color: #6b7280; }
      .step-icon { display: grid; place-items: center; width: 16px; height: 16px; color: #9ca3af; font-size: 11px; }
      .progress-step.active .step-icon { border-radius: 50%; background: #ccfbf1; color: var(--reader); animation: breathe 1.2s ease-in-out infinite; }
      .progress-step.done .step-icon { color: var(--reader); }
      .progress-note { margin: 10px 0 0 25px; color: #9ca3af; font-size: 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { opacity: .45; } }

      .composer-wrap {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 4;
        padding: 28px 20px 15px;
        background: linear-gradient(to bottom, rgb(255 255 255 / 0%), #fff 30%);
      }

      .composer {
        position: relative;
        width: min(820px, 100%);
        margin: 0 auto;
      }

      .composer textarea {
        display: block;
        width: 100%;
        min-height: 54px;
        max-height: 190px;
        resize: none;
        overflow-y: auto;
        padding: 15px 58px 15px 18px;
        border: 1px solid #d8dadd;
        border-radius: 18px;
        outline: none;
        background: #fff;
        color: #111827;
        line-height: 1.5;
        box-shadow: 0 8px 28px rgb(0 0 0 / 8%);
      }

      .composer textarea:focus { border-color: #aeb4bc; box-shadow: 0 8px 32px rgb(0 0 0 / 11%); }
      .composer textarea::placeholder { color: #9ca3af; }

      .send {
        position: absolute;
        right: 10px;
        bottom: 10px;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 11px;
        background: var(--accent);
        color: #fff;
        font-size: 18px;
        line-height: 1;
      }

      .send:disabled { cursor: default; opacity: .35; }
      .composer-hint { margin: 8px 0 0; color: #9ca3af; font-size: 11px; text-align: center; }

      @media (max-width: 760px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .composer-wrap { padding-right: 12px; padding-left: 12px; }
        .topbar { padding: 0 14px; }
        .mobile-new { display: block; }
        .online { display: none; }
        .conversation { width: min(100% - 24px, 820px); padding-top: 24px; }
        .welcome { min-height: calc(100dvh - 250px); }
        .suggestions { grid-template-columns: 1fr; }
        .suggestion:nth-child(n+3) { display: none; }
        .user-bubble { max-width: 88%; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="会话侧边栏">
        <div class="brand"><span class="brand-mark">问</span><span>问答助手</span></div>
        <button class="new-chat" id="new-chat" type="button"><span class="plus">＋</span><span>新建会话</span></button>
        <div class="sidebar-label">会话</div>
        <button class="history-item" id="history-item" type="button">新的会话</button>
        <div class="sidebar-footer">临时会话<br />刷新页面后记录将被清空</div>
      </aside>

      <section class="chat-panel">
        <header class="topbar">
          <button class="mobile-new" id="mobile-new" type="button" aria-label="新建会话">＋</button>
          <div class="topbar-title">问答助手</div>
          <div class="online"><span class="online-dot"></span><span>在线</span></div>
        </header>

        <main class="messages" id="messages" aria-live="polite">
          <div class="conversation" id="conversation">
            <section class="welcome" id="welcome">
              <div class="welcome-mark">问</div>
              <h1>今天想了解什么？</h1>
              <p>输入问题，开始新的对话</p>
              <div class="suggestions">
                <button class="suggestion" type="button">今天有哪些值得关注的 AI 新闻？</button>
                <button class="suggestion" type="button">Python 当前最新稳定版本是什么？</button>
                <button class="suggestion" type="button">概括本周最重要的科技动态</button>
                <button class="suggestion" type="button">当前热门游戏有哪些重要更新？</button>
              </div>
            </section>
          </div>
        </main>

        <div class="composer-wrap">
          <form class="composer" id="form">
            <textarea id="question" required maxlength="8000" rows="1" aria-label="输入消息" placeholder="输入消息"></textarea>
            <button class="send" id="submit" type="submit" aria-label="发送消息">↑</button>
          </form>
          <p class="composer-hint">Enter 发送 · Shift + Enter 换行</p>
        </div>
      </section>
    </div>

    <script>
      const form = document.querySelector('#form');
      const questionInput = document.querySelector('#question');
      const submit = document.querySelector('#submit');
      const messages = document.querySelector('#messages');
      const conversation = document.querySelector('#conversation');
      const welcome = document.querySelector('#welcome');
      const historyItem = document.querySelector('#history-item');
      const newChatButtons = [document.querySelector('#new-chat'), document.querySelector('#mobile-new')];
      let pending = false;
      let messageCount = 0;

      const scrollToBottom = () => requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight;
      });

      const resizeComposer = () => {
        questionInput.style.height = 'auto';
        questionInput.style.height = `${Math.min(questionInput.scrollHeight, 190)}px`;
      };

      const assistantShell = () => {
        const row = document.createElement('section');
        row.className = 'message assistant';
        const avatar = document.createElement('div');
        avatar.className = 'assistant-avatar';
        avatar.textContent = '答';
        const body = document.createElement('div');
        body.className = 'assistant-body';
        row.append(avatar, body);
        return { row, body };
      };

      const appendUser = (text) => {
        const row = document.createElement('section');
        row.className = 'message user';
        const bubble = document.createElement('div');
        bubble.className = 'user-bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        conversation.appendChild(row);
      };

      const appendLoading = () => {
        const { row, body } = assistantShell();
        const card = document.createElement('div');
        card.className = 'progress-card';
        const heading = document.createElement('div');
        heading.className = 'progress-title';
        const spinner = document.createElement('span');
        spinner.className = 'progress-spinner';
        const headingText = document.createElement('span');
        heading.append(spinner, headingText);
        const list = document.createElement('ol');
        list.className = 'progress-list';
        const stages = [
          ['searching', '查找相关信息'],
          ['reading', '阅读参考资料'],
          ['organizing', '整理回答'],
        ];
        const stageRows = stages.map(([stage, label]) => {
          const item = document.createElement('li');
          item.className = 'progress-step';
          item.dataset.stage = stage;
          const icon = document.createElement('span');
          icon.className = 'step-icon';
          const text = document.createElement('span');
          text.textContent = label;
          item.append(icon, text);
          list.appendChild(item);
          return { stage, item, icon, label };
        });
        const note = document.createElement('p');
        note.className = 'progress-note';
        card.append(heading, list, note);
        body.appendChild(card);
        conversation.appendChild(row);

        const update = (stage, detail = {}) => {
          const activeIndex = Math.max(0, stages.findIndex(([value]) => value === stage));
          stageRows.forEach((entry, index) => {
            entry.item.classList.toggle('done', index < activeIndex);
            entry.item.classList.toggle('active', index === activeIndex);
            entry.icon.textContent = index < activeIndex ? '✓' : index === activeIndex ? '•' : '○';
          });
          headingText.textContent = stageRows[activeIndex].label;
          const count = Array.isArray(detail.sources) ? detail.sources.length : Number(detail.source_count || 0);
          note.textContent = count ? `已获取 ${count} 个参考来源` : '';
          scrollToBottom();
        };

        update('searching');
        return { row, update };
      };

      const requestAnswer = async (question, onProgress) => {
        const response = await fetch('/v1/answer/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        if (!response.ok || !response.body) throw new Error('请求失败');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let result = null;

        const consume = (block) => {
          const line = block.split('\n').find((value) => value.startsWith('data: '));
          if (!line) return;
          const event = JSON.parse(line.slice(6));
          if (event.type === 'progress') onProgress(event.stage, event.detail || {});
          if (event.type === 'result') result = event.result;
          if (event.type === 'error') throw new Error(event.error?.message || '请求失败');
        };

        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || '';
          blocks.forEach(consume);
          if (done) break;
        }
        if (buffer.trim()) consume(buffer);
        if (!result) throw new Error('未收到完整回答');
        return result;
      };

      const appendAssistant = (data) => {
        const { row, body } = assistantShell();
        const answer = document.createElement('div');
        answer.className = 'assistant-answer';
        answer.textContent = data.answer;
        body.appendChild(answer);

        if (data.sources?.length) {
          const details = document.createElement('details');
          details.className = 'source-details';
          const summary = document.createElement('summary');
          summary.textContent = `${data.sources.length} 个参考来源`;
          const list = document.createElement('div');
          list.className = 'source-list';
          data.sources.forEach((source, index) => {
            const link = document.createElement('a');
            link.className = 'source-link';
            link.href = source.url;
            link.target = '_blank';
            link.rel = 'noreferrer';
            link.textContent = `${index + 1}. ${source.title || source.url}`;
            list.appendChild(link);
          });
          details.append(summary, list);
          body.appendChild(details);
        }

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        const seconds = Number(data.timings_ms?.total || 0) / 1000;
        meta.textContent = `${seconds.toFixed(1)} 秒${data.degraded ? ' · 部分任务已降级' : ''}`;
        body.appendChild(meta);
        conversation.appendChild(row);
      };

      const appendError = (message) => {
        const { row, body } = assistantShell();
        const answer = document.createElement('div');
        answer.className = 'assistant-answer';
        answer.textContent = `暂时无法回答：${message}`;
        body.appendChild(answer);
        conversation.appendChild(row);
      };

      const resetChat = () => {
        pending = false;
        messageCount = 0;
        submit.disabled = false;
        questionInput.disabled = false;
        questionInput.value = '';
        resizeComposer();
        conversation.querySelectorAll('.message').forEach((node) => node.remove());
        welcome.hidden = false;
        historyItem.textContent = '新的会话';
        questionInput.focus();
      };

      newChatButtons.forEach((button) => button.addEventListener('click', resetChat));
      historyItem.addEventListener('click', scrollToBottom);
      document.querySelectorAll('.suggestion').forEach((button) => {
        button.addEventListener('click', () => {
          questionInput.value = button.textContent.trim();
          resizeComposer();
          form.requestSubmit();
        });
      });

      questionInput.addEventListener('input', resizeComposer);
      questionInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question || pending) return;

        pending = true;
        submit.disabled = true;
        questionInput.disabled = true;
        welcome.hidden = true;
        appendUser(question);
        if (messageCount === 0) historyItem.textContent = question.slice(0, 24);
        messageCount += 1;
        questionInput.value = '';
        resizeComposer();
        const loading = appendLoading();
        scrollToBottom();

        try {
          const data = await requestAnswer(question, loading.update);
          loading.row.remove();
          appendAssistant(data);
        } catch (error) {
          loading.row.remove();
          appendError(error.message || '未知错误');
        } finally {
          pending = false;
          submit.disabled = false;
          questionInput.disabled = false;
          questionInput.focus();
          scrollToBottom();
        }
      });

      resizeComposer();
    </script>
  </body>
</html>
