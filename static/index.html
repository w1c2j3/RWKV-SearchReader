<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ec" />
    <title>寻答</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
        --ink: #18201f;
        --muted: #697471;
        --faint: #98a09e;
        --paper: #f4f2ec;
        --card: #fffefb;
        --line: #deddd7;
        --soft-line: #eae8e1;
        --forest: #132321;
        --forest-2: #1b312e;
        --mint: #287d70;
        --mint-soft: #e4f0ed;
        --shadow: 0 18px 55px rgb(31 42 39 / 9%);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
      button, textarea { font: inherit; }
      button { cursor: pointer; }

      .app { display: grid; grid-template-columns: 286px minmax(0, 1fr); height: 100dvh; }
      .sidebar {
        position: relative;
        z-index: 20;
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 22px 16px 16px;
        overflow: hidden;
        background: radial-gradient(circle at 15% 0%, rgb(54 112 101 / 30%), transparent 30%), var(--forest);
        color: #f6f5f1;
      }
      .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
      .brand-mark, .assistant-avatar {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border-radius: 13px;
        background: linear-gradient(145deg, #54a797, #26766a);
        color: white;
        font-family: Georgia, "Songti SC", serif;
        font-size: 18px;
        font-weight: 700;
        box-shadow: inset 0 1px rgb(255 255 255 / 25%), 0 8px 20px rgb(0 0 0 / 18%);
      }
      .brand-copy strong { display: block; font-size: 16px; letter-spacing: .08em; }
      .brand-copy span { display: block; margin-top: 3px; color: #9cb4af; font-size: 10px; letter-spacing: .12em; }
      .new-chat {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 14px;
        background: rgb(255 255 255 / 7%);
        color: white;
        text-align: left;
        transition: .18s ease;
      }
      .new-chat:hover { transform: translateY(-1px); background: rgb(255 255 255 / 12%); }
      .new-chat .plus { font-size: 22px; font-weight: 300; line-height: 1; }
      .history-heading { display: flex; align-items: center; justify-content: space-between; margin: 24px 8px 10px; }
      .history-heading span:first-child { color: #94aaa5; font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
      .history-heading span:last-child { color: #68817b; font-size: 10px; }
      .history-list { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #39514c transparent; }
      .history-empty { padding: 14px 10px; color: #7f9691; font-size: 12px; line-height: 1.6; }
      .history-item {
        display: block;
        width: 100%;
        margin: 2px 0;
        padding: 10px 11px;
        overflow: hidden;
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: #dfe8e5;
        text-align: left;
        transition: background .15s ease;
      }
      .history-item:hover, .history-item.active { background: rgb(255 255 255 / 9%); }
      .history-item:disabled { cursor: wait; opacity: .72; }
      .history-item.loading .history-time { color: #b7d8cf; }
      .history-item.error .history-time { color: #f2a7a7; }
      .history-question { display: block; overflow: hidden; font-size: 12px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
      .history-time { display: block; margin-top: 4px; color: #718a84; font-size: 10px; }
      .storage-card { margin-top: auto; padding: 13px 12px; border: 1px solid rgb(255 255 255 / 10%); border-radius: 13px; background: rgb(0 0 0 / 10%); }
      .storage-title { display: flex; align-items: center; gap: 8px; color: #d8e4e1; font-size: 11px; }
      .storage-dot { width: 7px; height: 7px; border-radius: 50%; background: #72c7a4; box-shadow: 0 0 0 4px rgb(114 199 164 / 10%); }
      .storage-copy { margin: 7px 0 0 15px; color: #718a84; font-size: 10px; line-height: 1.5; }
      .scrim { display: none; }

      .chat {
        position: relative;
        display: flex;
        min-width: 0;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        background: radial-gradient(circle at 84% -10%, rgb(50 132 115 / 10%), transparent 30%), linear-gradient(180deg, #f8f7f3 0%, var(--paper) 100%);
      }
      .topbar { z-index: 5; display: flex; align-items: center; min-height: 68px; padding: 0 28px; border-bottom: 1px solid rgb(208 208 201 / 72%); background: rgb(248 247 243 / 82%); backdrop-filter: blur(18px); }
      .menu-button { display: none; margin-right: 10px; border: 0; background: transparent; color: var(--ink); font-size: 22px; }
      .topbar-copy { min-width: 0; }
      .topbar-title { overflow: hidden; font-size: 14px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
      .topbar-subtitle { margin-top: 3px; color: var(--muted); font-size: 10px; }
      .status-pill { display: flex; align-items: center; gap: 7px; margin-left: auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgb(255 255 255 / 62%); color: var(--muted); font-size: 10px; }
      .status-pill.offline .status-dot { background: #c47762; box-shadow: 0 0 0 4px rgb(196 119 98 / 12%); }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #46a27f; }
      .messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
      .conversation { width: min(900px, calc(100% - 40px)); min-height: 100%; margin: 0 auto; padding: 34px 0 190px; }

      .welcome { display: grid; min-height: calc(100dvh - 290px); place-content: center; text-align: center; }
      .welcome-eyebrow { color: var(--mint); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .welcome h1 { max-width: 680px; margin: 13px auto 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(34px, 5vw, 54px); font-weight: 520; letter-spacing: -.045em; line-height: 1.12; }
      .welcome p { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
      .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(650px, 100%); margin: 34px auto 0; }
      .suggestion { position: relative; min-height: 72px; padding: 14px 42px 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: rgb(255 254 251 / 76%); color: #34403e; text-align: left; line-height: 1.45; box-shadow: 0 8px 30px rgb(46 58 54 / 4%); transition: .18s ease; }
      .suggestion::after { position: absolute; top: 50%; right: 16px; content: "↗"; color: #9aa4a1; transform: translateY(-50%); }
      .suggestion:hover { transform: translateY(-2px); border-color: #bfcac6; background: var(--card); box-shadow: var(--shadow); }

      .message { display: flex; gap: 14px; margin-bottom: 30px; animation: rise .26s ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
      .message.user { justify-content: flex-end; }
      .user-bubble { max-width: min(76%, 680px); padding: 12px 17px; border-radius: 20px 20px 6px 20px; background: #213532; color: #f8faf8; font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 10px 24px rgb(21 44 40 / 10%); }
      .assistant-avatar { width: 30px; height: 30px; margin-top: 2px; border-radius: 10px; font-size: 12px; box-shadow: none; }
      .assistant-body { min-width: 0; max-width: calc(100% - 44px); flex: 1; }

      .trace-card { margin-bottom: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: rgb(255 254 251 / 72%); box-shadow: 0 8px 26px rgb(38 52 48 / 4%); }
      .trace-card summary { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; list-style: none; cursor: pointer; user-select: none; }
      .trace-card summary::-webkit-details-marker { display: none; }
      .trace-state { display: grid; place-items: center; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 11px; }
      .trace-card.running .trace-state::before { width: 10px; height: 10px; border: 2px solid #9fc8c0; border-top-color: var(--mint); border-radius: 50%; content: ""; animation: spin .8s linear infinite; }
      .trace-card.done .trace-state::before { content: "✓"; font-weight: 800; }
      .trace-card.failed .trace-state { background: #f8e9e4; color: #ae5c46; }
      .trace-card.failed .trace-state::before { content: "!"; font-weight: 800; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .trace-heading { min-width: 0; flex: 1; }
      .trace-title { display: block; color: #34413e; font-size: 12px; font-weight: 680; }
      .trace-summary { display: block; margin-top: 2px; overflow: hidden; color: var(--faint); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .trace-chevron { color: #9ca6a3; font-size: 12px; transition: transform .18s ease; }
      .trace-card[open] .trace-chevron { transform: rotate(180deg); }
      .trace-body { padding: 4px 14px 14px 46px; border-top: 1px solid var(--soft-line); }
      .trace-progress { height: 3px; margin: 9px 0 13px; overflow: hidden; border-radius: 999px; background: #e8e8e2; }
      .trace-progress span { display: block; width: 4%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), #65a597); transition: width .35s ease; }
      .trace-list { max-height: min(58vh, 520px); margin: 0; padding: 0; overflow-y: auto; list-style: none; }
      .trace-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 0 9px 17px; color: #5e6b68; font-size: 11px; line-height: 1.5; }
      .trace-row::before { position: absolute; top: 12px; left: 1px; width: 6px; height: 6px; border-radius: 50%; background: #a9b9b5; content: ""; }
      .trace-row.done::before { background: var(--mint); }
      .trace-row.failed::before { background: #bf624d; }
      .trace-row-copy { min-width: 0; }
      .trace-row-title { display: block; color: #46524f; }
      .trace-row-note { display: block; margin-top: 3px; color: var(--faint); white-space: normal; overflow-wrap: anywhere; }
      .trace-time { color: #a0a7a5; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .trace-extra { display: grid; gap: 6px; margin-top: 8px; }
      .trace-query-list { display: flex; flex-wrap: wrap; gap: 5px; }
      .trace-query { max-width: 100%; padding: 4px 7px; border-radius: 7px; background: #eef4f1; color: #58706a; font-size: 10px; overflow-wrap: anywhere; }
      .trace-query::before { margin-right: 4px; color: #83a098; content: "查找"; font-size: 8px; font-weight: 750; letter-spacing: .08em; }
      .trace-source-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .trace-source { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; min-width: 0; padding: 7px 8px; border: 1px solid var(--soft-line); border-radius: 9px; background: rgb(255 255 255 / 48%); color: #5c6865; text-decoration: none; }
      .trace-source:hover { border-color: #c8d3cf; background: #fff; }
      .trace-source-id { color: var(--mint); font-size: 9px; font-weight: 760; }
      .trace-source-copy { min-width: 0; }
      .trace-source-title { display: -webkit-box; overflow: hidden; color: #52605d; font-size: 10px; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .trace-source-meta { display: block; margin-top: 2px; overflow: hidden; color: #9aa3a0; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
      .assistant-answer { color: #202826; font-size: 15px; line-height: 1.86; overflow-wrap: anywhere; }
      .assistant-answer p { margin: 0 0 10px; white-space: pre-wrap; }
      .assistant-answer p:last-child { margin-bottom: 0; }
      .assistant-answer ul, .assistant-answer ol { margin: 5px 0 12px; padding-left: 24px; }
      .assistant-answer li { margin: 4px 0; }
      .assistant-answer h1, .assistant-answer h2, .assistant-answer h3 { margin: 14px 0 7px; line-height: 1.45; }
      .assistant-answer h1 { font-size: 20px; } .assistant-answer h2 { font-size: 18px; } .assistant-answer h3 { font-size: 16px; }
      .assistant-answer code { padding: 2px 5px; border-radius: 5px; background: #e9eeeb; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
      .assistant-answer pre { margin: 10px 0 14px; padding: 13px 15px; overflow-x: auto; border-radius: 12px; background: #18211f; color: #e7efec; line-height: 1.55; white-space: pre; }
      .assistant-answer pre code { padding: 0; background: transparent; color: inherit; }
      .answer-label { margin-bottom: 7px; color: var(--mint); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
      .source-details { margin-top: 16px; }
      .source-details summary { width: fit-content; color: var(--muted); font-size: 11px; cursor: pointer; user-select: none; }
      .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
      .source-link { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 9px 10px; border: 1px solid var(--soft-line); border-radius: 11px; background: rgb(255 255 255 / 55%); color: #596562; font-size: 10px; text-decoration: none; }
      .source-link:hover { border-color: #c8d3cf; background: var(--card); color: var(--ink); }
      .source-number { display: grid; place-items: center; flex: 0 0 auto; width: 21px; height: 21px; border-radius: 7px; background: var(--mint-soft); color: var(--mint); font-size: 9px; font-weight: 750; }
      .source-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .message-meta { margin-top: 12px; color: var(--faint); font-size: 10px; }

      .composer-wrap { position: absolute; right: 0; bottom: 0; left: 0; z-index: 7; padding: 36px 22px 16px; background: linear-gradient(to bottom, rgb(244 242 236 / 0%), var(--paper) 32%); }
      .composer { position: relative; width: min(900px, 100%); margin: 0 auto; }
      .attachment-tray { display: flex; flex-wrap: wrap; gap: 7px; min-height: 0; margin: 0 10px 8px; }
      .attachment-tray:empty { display: none; }
      .attachment-chip { display: flex; align-items: center; gap: 7px; max-width: min(360px, 90%); padding: 7px 10px; border: 1px solid #cfd9d5; border-radius: 11px; background: #edf4f1; color: #42524e; font-size: 10px; }
      .attachment-icon { display: grid; place-items: center; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; background: var(--mint); color: white; font-size: 8px; font-weight: 800; }
      .attachment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .attachment-meta { flex: 0 0 auto; color: #80908c; }
      .attachment-chip.notice { border-color: #cfd9d5; background: #edf4f1; color: #58706a; }
      .attachment-chip.error { border-color: #e2c8c0; background: #f8ece8; color: #9b5948; }
      .composer-box { position: relative; padding: 8px 8px 8px 58px; border: 1px solid #d4d4cd; border-radius: 21px; background: var(--card); box-shadow: 0 16px 48px rgb(42 53 50 / 11%); transition: .18s ease; }
      .composer-box:focus-within { border-color: #aebfba; box-shadow: 0 18px 54px rgb(42 53 50 / 15%); }
      .composer textarea { display: block; width: 100%; min-height: 44px; max-height: 180px; padding: 11px 52px 9px 0; resize: none; overflow-y: auto; border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.55; }
      .composer textarea::placeholder { color: #9ca4a2; }
      .attach { position: absolute; bottom: 8px; left: 8px; display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 13px; background: #edf0ec; color: #53615e; font-size: 19px; transition: .18s ease; }
      .attach:hover:not(:disabled) { background: var(--mint-soft); color: var(--mint); }
      .attach:disabled { cursor: default; opacity: .38; }
      .send { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 13px; background: var(--forest-2); color: white; font-size: 18px; transition: .18s ease; }
      .send:hover:not(:disabled) { transform: translateY(-1px); background: var(--mint); }
      .send:disabled { cursor: default; opacity: .34; }
      .composer-hint { margin: 8px 0 0; color: #909996; font-size: 10px; text-align: center; }

      @media (max-width: 780px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 310px); transform: translateX(-102%); transition: transform .22s ease; }
        .sidebar.open { transform: translateX(0); }
        .scrim { position: fixed; z-index: 15; display: block; inset: 0; border: 0; background: rgb(9 18 16 / 42%); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
        .scrim.open { opacity: 1; pointer-events: auto; }
        .menu-button { display: block; }
        .topbar { min-height: 60px; padding: 0 14px; }
        .status-pill { display: none; }
        .conversation { width: min(100% - 24px, 900px); padding-top: 24px; }
        .welcome { min-height: calc(100dvh - 255px); }
        .welcome h1 { font-size: 36px; }
        .suggestions { grid-template-columns: 1fr; }
        .suggestion:nth-child(n+4) { display: none; }
        .user-bubble { max-width: 90%; }
        .source-grid { grid-template-columns: 1fr; }
        .trace-source-list { grid-template-columns: 1fr; }
        .trace-body { padding-left: 14px; }
        .composer-wrap { padding-right: 12px; padding-left: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="历史记录">
        <div class="brand">
          <span class="brand-mark">寻</span>
          <div class="brand-copy"><strong>寻答</strong><span>SEARCH · READ · ANSWER</span></div>
        </div>
        <button class="new-chat" id="new-chat" type="button"><span class="plus">＋</span><span>开始新对话</span></button>
        <div class="history-heading"><span>本地记录</span><span id="history-count">0</span></div>
        <div class="history-list" id="history-list"><div class="history-empty">正在读取这台电脑上的历史记录…</div></div>
        <div class="storage-card">
          <div class="storage-title"><span class="storage-dot"></span><span>记录已保存到本机</span></div>
          <p class="storage-copy">问题、回答、来源、逐步过程与耗时都会保留，便于之后分析。</p>
        </div>
      </aside>
      <button class="scrim" id="scrim" type="button" aria-label="关闭侧栏"></button>

      <section class="chat">
        <header class="topbar">
          <button class="menu-button" id="menu" type="button" aria-label="打开历史记录">☰</button>
          <div class="topbar-copy">
            <div class="topbar-title" id="chat-title">新的对话</div>
            <div class="topbar-subtitle">每个回答都附带可展开的查找与阅读过程</div>
          </div>
          <div class="status-pill" id="service-status"><span class="status-dot"></span><span>正在检查</span></div>
        </header>

        <main class="messages" id="messages" aria-live="polite">
          <div class="conversation" id="conversation">
            <section class="welcome" id="welcome">
              <div class="welcome-eyebrow">Evidence-led answers</div>
              <h1>从资料里，找到更清楚的答案</h1>
              <p>提出问题，查找、阅读和核对过程会实时显示。</p>
              <div class="suggestions">
                <button class="suggestion" type="button">今天有哪些值得关注的 AI 新闻？</button>
                <button class="suggestion" type="button">Python 3.13.0 的正式发布日期是什么？</button>
                <button class="suggestion" type="button">概括本周最重要的科技动态</button>
                <button class="suggestion" type="button">当前热门游戏有哪些重要更新？</button>
              </div>
            </section>
          </div>
        </main>

        <div class="composer-wrap">
          <form class="composer" id="form">
            <div class="attachment-tray" id="attachment-tray"></div>
            <div class="composer-box">
              <input id="document-file" type="file" accept=".md,.markdown,.pdf,text/markdown,application/pdf" hidden />
              <button class="attach" id="attach" type="button" aria-label="上传文档" title="上传 Markdown 或 PDF">＋</button>
              <textarea id="question" required maxlength="8000" rows="1" aria-label="输入问题" placeholder="问一个具体的问题…"></textarea>
              <button class="send" id="submit" type="submit" aria-label="发送">↑</button>
            </div>
          </form>
          <p class="composer-hint">Enter 发送 · Shift + Enter 换行</p>
        </div>
      </section>
    </div>

    <script>
      const form = document.querySelector('#form');
      const questionInput = document.querySelector('#question');
      const submit = document.querySelector('#submit');
      const attach = document.querySelector('#attach');
      const documentFile = document.querySelector('#document-file');
      const attachmentTray = document.querySelector('#attachment-tray');
      const messages = document.querySelector('#messages');
      const conversation = document.querySelector('#conversation');
      const welcome = document.querySelector('#welcome');
      const historyList = document.querySelector('#history-list');
      const historyCount = document.querySelector('#history-count');
      const chatTitle = document.querySelector('#chat-title');
      const sidebar = document.querySelector('#sidebar');
      const scrim = document.querySelector('#scrim');
      const serviceStatus = document.querySelector('#service-status');
      const conversationStorageKey = 'rwkv-search-reader-session';
      const clientStorageKey = 'rwkv-search-reader-client';
      const randomToken = () => (crypto.randomUUID?.() || `${Date.now()}${Math.random()}`).replace(/[^A-Za-z0-9]/g, '');
      const createConversationId = () => `conv_${randomToken()}`;
      const createClientId = () => `client_${randomToken()}`;
      const readConversationId = () => {
        try { return localStorage.getItem(conversationStorageKey) || createConversationId(); }
        catch (_) { return createConversationId(); }
      };
      const readClientId = () => {
        try { return localStorage.getItem(clientStorageKey) || createClientId(); }
        catch (_) { return createClientId(); }
      };
      const saveConversationIdentity = () => {
        try {
          localStorage.setItem(conversationStorageKey, conversationId);
          localStorage.setItem(clientStorageKey, clientId);
        } catch (_) {}
      };
      let pending = false;
      let uploading = false;
      let activeController = null;
      let activeUploadController = null;
      let requestGeneration = 0;
      let historyRequestGeneration = 0;
      let conversationId = readConversationId();
      const clientId = readClientId();
      saveConversationIdentity();
      let conversationRecords = [];
      let currentDocuments = [];
      let documentNotice = '';

      const scrollToBottom = () => requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
      const formatTime = (value) => {
        if (!value) return '';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
      };
      const resizeComposer = () => {
        questionInput.style.height = 'auto';
        questionInput.style.height = `${Math.min(questionInput.scrollHeight, 180)}px`;
      };
      const closeSidebar = () => { sidebar.classList.remove('open'); scrim.classList.remove('open'); };
      const loadReadiness = async () => {
        try {
          const response = await fetch('/readyz', { cache: 'no-store' });
          const data = await response.json();
          serviceStatus.classList.toggle('offline', !data.ready);
          serviceStatus.querySelector('span:last-child').textContent = data.ready ? '可以提问' : '暂时不可用';
        } catch (_) {
          serviceStatus.classList.add('offline');
          serviceStatus.querySelector('span:last-child').textContent = '暂时不可用';
        }
      };
      const formatBytes = (value) => {
        const bytes = Number(value || 0);
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      };
      const renderDocuments = () => {
        attachmentTray.replaceChildren();
        currentDocuments.forEach((fileRecord) => {
          const chip = document.createElement('div');
          chip.className = 'attachment-chip';
          const icon = document.createElement('span');
          icon.className = 'attachment-icon';
          icon.textContent = fileRecord.source_mime === 'application/pdf' ? 'PDF' : 'MD';
          const name = document.createElement('span');
          name.className = 'attachment-name';
          name.textContent = fileRecord.filename || '本地文档';
          const meta = document.createElement('span');
          meta.className = 'attachment-meta';
          meta.textContent = `${fileRecord.chunk_count || 0} 段 · ${formatBytes(fileRecord.size_bytes)}`;
          chip.append(icon, name, meta);
          attachmentTray.appendChild(chip);
        });
        if (documentNotice) {
          const error = document.createElement('div');
          error.className = `attachment-chip ${uploading ? 'notice' : 'error'}`;
          error.textContent = documentNotice;
          attachmentTray.appendChild(error);
        }
        questionInput.placeholder = currentDocuments.length ? `询问 ${currentDocuments[0].filename}…` : '问一个具体的问题…';
      };

      const assistantShell = () => {
        const row = document.createElement('section');
        row.className = 'message assistant';
        const avatar = document.createElement('div');
        avatar.className = 'assistant-avatar';
        avatar.textContent = '寻';
        const body = document.createElement('div');
        body.className = 'assistant-body';
        row.append(avatar, body);
        conversation.appendChild(row);
        return { row, body };
      };

      const appendUser = (text) => {
        const row = document.createElement('section');
        row.className = 'message user';
        const bubble = document.createElement('div');
        bubble.className = 'user-bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        conversation.appendChild(row);
      };

      const eventCopy = (stage, detail = {}) => {
        if (stage === 'preparing') return ['已收到问题', '正在开始处理'];
        if (stage === 'responding') return ['识别为简单对话', '无需查找资料，直接回应'];
        if (stage === 'history_reading') return [`正在阅读此前 ${detail.turn_count || 0} 轮对话`, '直接根据本次对话整理回答'];
        if (stage === 'contextualizing') return [`正在衔接此前 ${detail.turn_count || 0} 轮对话`, '补全当前问题中的上下文指代'];
        if (stage === 'context_resolved') return ['已理解当前追问', detail.resolved_question || '已形成完整问题'];
        if (stage === 'planning') return ['正在理解问题范围', '判断需要回答的对象、字段和检索任务'];
        if (stage === 'plan_completed') return [detail.decision === 'clarify' ? '需要先确认问题指代' : (detail.scope_mode === 'discover' ? `已设计 ${(detail.queries || []).length || 1} 个检索点` : `已拆分为 ${(detail.queries || []).length || 1} 个检索任务`), detail.decision === 'clarify' ? (detail.clarification || '缺少无法从公开资料确定的指代') : (detail.goal || '已形成本轮资料计划')];
        if (stage === 'clarifying') return ['正在等待你补充范围', detail.message || '补充范围后可以继续'];
        if (stage === 'searching') return ['开始查找相关资料', detail.query ? `围绕“${detail.query}”查找` : '正在理解问题并发起检索'];
        if (stage === 'sources_found') return [`找到 ${detail.source_count || 0} 个参考来源`, `使用了 ${(detail.queries || []).length || 1} 个检索式`];
        if (stage === 'search_points_collected') return [`${(detail.queries || []).length || 1} 个检索点均已取得材料`, '每个检索点将先独立归纳，再进入最终总结'];
        if (stage === 'scope_discovering') return ['正在从资料中确定具体对象', `阅读首轮 ${detail.source_count || 0} 份资料后再确定本轮覆盖范围`];
        if (stage === 'scope_discovered') return [detail.success === false ? '未能稳定拆分具体对象' : `已确定 ${(detail.subjects || []).length} 个代表性对象`, detail.success === false ? (detail.message || '将直接使用现有资料回答') : ((detail.subjects || []).join('、') || detail.message || '范围已经确定')];
        if (stage === 'scope_searching') return [`开始逐对象补充查找`, `并行覆盖 ${detail.subject_count || 0} 个具体对象`];
        if (stage === 'scope_sources_found') return [`逐对象补充找到 ${detail.source_count || 0} 个新来源`, `目前共 ${detail.total_source_count || 0} 个来源`];
        if (stage === 'document_searching') return [`正在阅读 ${detail.document_count || 0} 份文档`, '定位与当前问题相关的章节和段落'];
        if (stage === 'documents_found') return [`选出 ${detail.source_count || 0} 个文档片段`, '下面是本轮实际选中的文档位置'];
        if (stage === 'reading') return [`开始逐篇阅读 ${detail.source_count || 0} 个来源`, '每个来源独立阅读，互不混合'];
        if (stage === 'source_read') return [`已读 ${detail.completed || 0}/${detail.total || 0} · ${detail.source_id || '材料'} · ${detail.title || '参考资料'}`, `${detail.retrieval_point ? `检索点：${detail.retrieval_point} · ` : ''}${detail.retrieval_query ? `检索词：${detail.retrieval_query} · ` : ''}${detail.status === 'degraded' ? '读取不完整：' : '提取结果：'}${detail.summary_preview || '关键信息已提取'}`];
        if (stage === 'auditing') return [`第 ${detail.round || 1} 次检查材料完整性`, `逐项检查问题需要的事实；当前共有 ${detail.source_count || 0} 份阅读结果`];
        if (stage === 'audit_completed') return [detail.sufficient ? '材料检查通过' : '发现材料缺口', detail.sufficient ? (detail.message || '检查已经完成') : `${detail.message || '需要补充材料'}${(detail.queries || []).length ? `：${detail.queries.join('；')}` : ''}`];
        if (stage === 'supplemental_searching') return [`第 ${detail.round || 1} 轮补充查找`, '只查找审核发现的缺失部分'];
        if (stage === 'supplemental_sources_found') return [`补充找到 ${detail.source_count || 0} 个新来源`, `排除重复页面后，目前共 ${detail.total_source_count || 0} 个来源`];
        if (stage === 'supplemental_reading') return [`开始阅读 ${detail.source_count || 0} 个补充来源`, `累计 ${detail.total_source_count || 0} 个来源`];
        if (stage === 'reviewing') return [`正在进行第 ${detail.level || 1} 层材料归并`, `先在各检索点内归纳，再按上下文预算处理 ${detail.group_count || 0} 组材料`];
        if (stage === 'evidence_group_read') return [`第 ${detail.level || 1} 层已归纳 ${detail.completed || 0}/${detail.total || 0} 组 · ${(detail.source_ids || []).join(' + ')}`, `${detail.retrieval_point ? `检索点：${detail.retrieval_point} · ` : ''}${detail.status === 'retained' ? '该检索点继续保持独立' : `合并结果：${detail.summary_preview || '重复信息已合并'}`}`];
        if (stage === 'branch_finalizing') return [`正在形成 ${detail.branch_count || 0} 份分支最终总结`, (detail.retrieval_points || []).join('、') || '每个检索点分别确认当前信息'];
        if (stage === 'branch_finalized') return [`分支总结 ${detail.completed || 0}/${detail.total || 0} · ${detail.retrieval_point || '检索点'}`, `${detail.status === 'degraded' ? '保留归并材料：' : '分支结果：'}${detail.summary_preview || '当前信息已经整理'}`];
        if (stage === 'aggregating') return [`正在汇总 ${detail.branch_count || 0} 个独立分支`, (detail.retrieval_points || []).join('、') || '每个检索点已经各自形成一份总结'];
        if (stage === 'aggregate_completed') return [detail.status === 'degraded' ? '分支汇总保留原材料' : '分支汇总已经完成', '接下来只根据这份汇总材料形成最终回答'];
        if (stage === 'finalizing') return ['正在形成最终回答', detail.group_count ? `${detail.source_count || 0} 份网页材料已归并为 ${detail.group_count} 份最终材料` : `根据 ${detail.source_count || 0} 份阅读结果直接作答`];
        if (stage === 'evidence_selecting') return ['正在建立回答与来源的对应关系', `逐项核对 ${detail.field_count || 0} 个必答字段`];
        if (stage === 'evidence_page_checked') return [`已检查网页 ${detail.completed || 0}/${detail.total || 0} · ${detail.subject || '对象'} · ${detail.field || '字段'}`, `${detail.source_id || '材料'}：${detail.status === 'found' ? '找到候选事实' : detail.status === 'degraded' ? '本页读取未完成' : '本页没有该字段'}`];
        if (stage === 'evidence_record_resolved') return [`已整理对象 ${detail.completed || 0}/${detail.total || 0}`, detail.subject || '字段记录已经整理'];
        if (stage === 'evidence_field_selected') return [`已核对 ${detail.completed || 0}/${detail.total || 0} · ${detail.subject || '对象'} · ${detail.field || '字段'}`, detail.status === 'supported' ? `绑定来源 ${detail.source_id || ''}：${detail.fact_preview || '已有直接证据'}` : `${detail.status === 'conflict' ? '材料存在冲突' : '材料尚未覆盖'}：${detail.fact_preview || ''}`];
        if (stage === 'completed') return ['回答已经完成', '完整记录已写入本机'];
        if (stage === 'failed') return ['本次回答未完成', detail.message || '处理过程中出现错误'];
        return [stage, ''];
      };

      const traceQueries = (stage, detail) => {
        if (stage === 'searching' && detail.query) return [detail.query];
        if (stage === 'supplemental_searching' && detail.retrieval_point_by_query) {
          return Object.entries(detail.retrieval_point_by_query).map(([query, point]) => `${point}：${query}`);
        }
        if (['plan_completed', 'search_points_collected'].includes(stage) && (detail.retrieval_points || []).length) {
          return detail.retrieval_points.map((point, index) => `${point}：${(detail.queries || [])[index] || ''}`);
        }
        if (['plan_completed', 'sources_found', 'search_points_collected', 'scope_discovered', 'scope_searching', 'scope_sources_found', 'audit_completed', 'supplemental_searching', 'supplemental_sources_found'].includes(stage)) return detail.queries || [];
        return [];
      };

      const traceSourceMeta = (source) => {
        const parts = [];
        if (source.retrieval_point) parts.push(`检索点 ${source.retrieval_point}`);
        if (source.published_date) parts.push(`时间 ${source.published_date}`);
        if (/^https?:\/\//i.test(source.url || '')) {
          try { parts.push(new URL(source.url).hostname.replace(/^www\./, '')); }
          catch (_) {}
        } else if ((source.url || '').startsWith('document://')) parts.push('本地文档');
        return parts.join(' · ');
      };

      const appendTraceDetails = (copy, stage, detail) => {
        const queries = traceQueries(stage, detail);
        const sources = ['sources_found', 'scope_sources_found', 'documents_found', 'supplemental_sources_found'].includes(stage) ? (detail.sources || []) : [];
        if (!queries.length && !sources.length) return;
        const extra = document.createElement('span');
        extra.className = 'trace-extra';
        if (queries.length) {
          const queryList = document.createElement('span');
          queryList.className = 'trace-query-list';
          queries.forEach((query) => {
            const item = document.createElement('span');
            item.className = 'trace-query';
            item.textContent = query;
            queryList.appendChild(item);
          });
          extra.appendChild(queryList);
        }
        if (sources.length) {
          const sourceList = document.createElement('span');
          sourceList.className = 'trace-source-list';
          sources.forEach((source, index) => {
            const isWeb = /^https?:\/\//i.test(source.url || '');
            const item = document.createElement(isWeb ? 'a' : 'span');
            item.className = 'trace-source';
            if (isWeb) {
              item.href = source.url;
              item.target = '_blank';
              item.rel = 'noreferrer';
            }
            const id = document.createElement('span');
            id.className = 'trace-source-id';
            id.textContent = source.source_id || `S${index + 1}`;
            const sourceCopy = document.createElement('span');
            sourceCopy.className = 'trace-source-copy';
            const sourceTitle = document.createElement('span');
            sourceTitle.className = 'trace-source-title';
            sourceTitle.textContent = source.title || source.url || '参考资料';
            sourceCopy.appendChild(sourceTitle);
            const meta = traceSourceMeta(source);
            if (meta) {
              const sourceMeta = document.createElement('span');
              sourceMeta.className = 'trace-source-meta';
              sourceMeta.textContent = meta;
              sourceCopy.appendChild(sourceMeta);
            }
            item.append(id, sourceCopy);
            sourceList.appendChild(item);
          });
          extra.appendChild(sourceList);
        }
        copy.appendChild(extra);
      };

      const createTrace = (events = [], open = true) => {
        let terminal = false;
        const details = document.createElement('details');
        details.className = 'trace-card running';
        details.open = open;
        const summary = document.createElement('summary');
        const state = document.createElement('span');
        state.className = 'trace-state';
        const heading = document.createElement('span');
        heading.className = 'trace-heading';
        const title = document.createElement('span');
        title.className = 'trace-title';
        title.textContent = '正在查找与阅读';
        const sub = document.createElement('span');
        sub.className = 'trace-summary';
        sub.textContent = '过程会实时显示在这里';
        heading.append(title, sub);
        const chevron = document.createElement('span');
        chevron.className = 'trace-chevron';
        chevron.textContent = '⌃';
        summary.append(state, heading, chevron);
        const body = document.createElement('div');
        body.className = 'trace-body';
        const progress = document.createElement('div');
        progress.className = 'trace-progress';
        const progressBar = document.createElement('span');
        progress.appendChild(progressBar);
        const list = document.createElement('ol');
        list.className = 'trace-list';
        body.append(progress, list);
        details.append(summary, body);

        const update = (stage, detail = {}) => {
          const [label, note] = eventCopy(stage, detail);
          const row = document.createElement('li');
          row.className = `trace-row ${stage === 'failed' ? 'failed' : 'done'}`;
          const copy = document.createElement('span');
          copy.className = 'trace-row-copy';
          const rowTitle = document.createElement('span');
          rowTitle.className = 'trace-row-title';
          rowTitle.textContent = label;
          copy.appendChild(rowTitle);
          if (note) {
            const rowNote = document.createElement('span');
            rowNote.className = 'trace-row-note';
            rowNote.textContent = note;
            copy.appendChild(rowNote);
          }
          appendTraceDetails(copy, stage, detail);
          const time = document.createElement('span');
          time.className = 'trace-time';
          const atMs = Number(detail.at_ms || 0);
          time.textContent = atMs ? `${(atMs / 1000).toFixed(1)}s` : '';
          row.append(copy, time);
          list.appendChild(row);
          list.scrollTop = list.scrollHeight;
          if (stage === 'source_read') progressBar.style.width = `${8 + 48 * Number(detail.completed || 0) / Math.max(1, Number(detail.total || 1))}%`;
          if (stage === 'finalizing') progressBar.style.width = '92%';
          if (stage === 'completed') {
            terminal = true;
            progressBar.style.width = '100%';
            details.classList.remove('running');
            details.classList.add('done');
            title.textContent = '查找与阅读过程';
            sub.textContent = `${list.children.length} 个步骤 · ${(Number(detail.duration_ms || atMs) / 1000).toFixed(1)} 秒`;
          } else if (stage === 'failed') {
            terminal = true;
            details.classList.remove('running');
            details.classList.add('failed');
            title.textContent = '处理未完成';
            sub.textContent = note;
          } else {
            sub.textContent = label;
          }
          scrollToBottom();
        };
        events.forEach((event) => update(event.stage, { ...(event.detail || {}), at_ms: event.at_ms }));
        if (!events.length && open) update('preparing');
        if (!events.length && !open) {
          terminal = true;
          progressBar.style.width = '100%';
          details.classList.remove('running');
          details.classList.add('done');
          title.textContent = '已保存的回答';
          sub.textContent = '此记录创建于详细过程启用前';
        }
        return { details, update, isTerminal: () => terminal };
      };

      const appendSources = (body, sources) => {
        if (!sources?.length) return;
        const details = document.createElement('details');
        details.className = 'source-details';
        const summary = document.createElement('summary');
        summary.textContent = `查看 ${sources.length} 个参考来源`;
        const grid = document.createElement('div');
        grid.className = 'source-grid';
        sources.forEach((source, index) => {
          const isWeb = /^https?:\/\//i.test(source.url || '');
          const link = document.createElement(isWeb ? 'a' : 'div');
          link.className = 'source-link';
          if (isWeb) {
            link.href = source.url;
            link.target = '_blank';
            link.rel = 'noreferrer';
          }
          const number = document.createElement('span');
          number.className = 'source-number';
          number.textContent = source.source_id || `S${index + 1}`;
          const name = document.createElement('span');
          name.className = 'source-name';
          name.textContent = source.title || source.url;
          link.append(number, name);
          grid.appendChild(link);
        });
        details.append(summary, grid);
        body.appendChild(details);
      };

      const appendInlineMarkdown = (parent, text) => {
        const pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*)/g;
        let offset = 0;
        for (const match of text.matchAll(pattern)) {
          if (match.index > offset) parent.appendChild(document.createTextNode(text.slice(offset, match.index)));
          const token = match[0];
          const node = document.createElement(token.startsWith('`') ? 'code' : 'strong');
          node.textContent = token.startsWith('`') ? token.slice(1, -1) : token.slice(2, -2);
          parent.appendChild(node);
          offset = match.index + token.length;
        }
        if (offset < text.length) parent.appendChild(document.createTextNode(text.slice(offset)));
      };

      const renderAnswer = (container, value) => {
        const text = String(value || '没有生成回答。').replace(/\r\n?/g, '\n');
        const segments = text.split(/```/);
        segments.forEach((segment, segmentIndex) => {
          if (segmentIndex % 2) {
            const lines = segment.split('\n');
            if (lines[0] && /^[A-Za-z0-9_+-]+$/.test(lines[0].trim())) lines.shift();
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = lines.join('\n').replace(/^\n|\n$/g, '');
            pre.appendChild(code);
            container.appendChild(pre);
            return;
          }
          let activeList = null;
          let activeType = '';
          const closeList = () => { activeList = null; activeType = ''; };
          segment.split('\n').forEach((rawLine) => {
            const line = rawLine.trimEnd();
            if (!line.trim()) { closeList(); return; }
            const heading = line.match(/^(#{1,3})\s+(.+)$/);
            const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
            const numbered = line.match(/^\s*\d+[.)、]\s+(.+)$/);
            if (heading) {
              closeList();
              const node = document.createElement(`h${heading[1].length}`);
              appendInlineMarkdown(node, heading[2]);
              container.appendChild(node);
              return;
            }
            if (bullet || numbered) {
              const type = bullet ? 'ul' : 'ol';
              if (!activeList || activeType !== type) {
                activeList = document.createElement(type);
                activeType = type;
                container.appendChild(activeList);
              }
              const item = document.createElement('li');
              appendInlineMarkdown(item, (bullet || numbered)[1]);
              activeList.appendChild(item);
              return;
            }
            closeList();
            const paragraph = document.createElement('p');
            appendInlineMarkdown(paragraph, line);
            container.appendChild(paragraph);
          });
        });
      };

      const finishAssistant = (body, data) => {
        const label = document.createElement('div');
        label.className = 'answer-label';
        label.textContent = '回答';
        const answer = document.createElement('div');
        answer.className = 'assistant-answer';
        renderAnswer(answer, data.answer);
        body.append(label, answer);
        appendSources(body, data.sources || []);
        const meta = document.createElement('div');
        meta.className = 'message-meta';
        const seconds = Number(data.timings_ms?.total || 0) / 1000;
        meta.textContent = `${seconds.toFixed(1)} 秒 · 已保存到本机${data.degraded ? ' · 部分步骤降级' : ''}`;
        body.appendChild(meta);
      };

      const appendError = (body, message) => {
        const answer = document.createElement('div');
        answer.className = 'assistant-answer';
        answer.textContent = `暂时无法回答：${message}`;
        body.appendChild(answer);
      };

      const requestAnswer = async (question, onProgress, signal) => {
        const response = await fetch('/v1/answer/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal,
          body: JSON.stringify({
            question,
            conversation_id: conversationId,
            client_id: clientId,
          }),
        });
        if (!response.ok || !response.body) {
          const error = await response.json().catch(() => ({}));
          throw new Error(typeof error.detail === 'string' ? error.detail : '请求失败');
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let result = null;
        const consume = (block) => {
          const line = block.split('\n').find((value) => value.startsWith('data: '));
          if (!line) return;
          const event = JSON.parse(line.slice(6));
          if (event.type === 'progress') onProgress(event.stage, event.detail || {});
          if (event.type === 'result') result = event.result;
          if (event.type === 'error') throw new Error(event.error?.message || '请求失败');
        };
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || '';
          blocks.forEach(consume);
          if (done) break;
        }
        if (buffer.trim()) consume(buffer);
        if (!result) throw new Error('未收到完整回答');
        return result;
      };

      const conversationTurns = (record) => {
        const turns = [];
        let question = '';
        (record.items || []).forEach((item) => {
          if (item.role === 'user') {
            question = item.content || '';
          } else if (item.role === 'assistant' && question) {
            const payload = item.payload || {};
            turns.push({
              question,
              answer: item.content || '',
              sources: payload.sources || [],
              trace: payload.trace || [],
              timings_ms: payload.timings_ms || {},
              degraded: Boolean(payload.degraded),
              warnings: payload.warnings || [],
              status: 'ok',
            });
            question = '';
          }
        });
        return turns;
      };

      const markActiveHistory = () => {
        historyList.querySelectorAll('.history-item').forEach((item) => {
          const active = item.dataset.conversationId === conversationId;
          item.classList.toggle('active', active);
          if (active) item.setAttribute('aria-current', 'true');
          else item.removeAttribute('aria-current');
        });
      };

      const showConversation = (record) => {
        if (pending || uploading) {
          requestGeneration += 1;
          activeController?.abort();
          activeUploadController?.abort();
          activeController = null;
          activeUploadController = null;
          pending = false;
          uploading = false;
          submit.disabled = false;
          attach.disabled = false;
          questionInput.disabled = false;
        }
        const turns = conversationTurns(record);
        conversation.querySelectorAll('.message').forEach((node) => node.remove());
        welcome.hidden = Boolean(turns.length);
        conversationId = record.id;
        currentDocuments = record.documents || [];
        documentNotice = '';
        questionInput.value = '';
        renderDocuments();
        resizeComposer();
        saveConversationIdentity();
        turns.forEach((turn) => {
          appendUser(turn.question || '');
          const { body } = assistantShell();
          const trace = createTrace(turn.trace || [], false);
          body.appendChild(trace.details);
          if (turn.status === 'error') appendError(body, turn.error?.message || '处理未完成');
          else finishAssistant(body, turn);
        });
        chatTitle.textContent = record.title || (turns[0]?.question || currentDocuments[0]?.filename || '历史记录').slice(0, 42);
        submit.disabled = false;
        attach.disabled = false;
        questionInput.disabled = false;
        markActiveHistory();
        closeSidebar();
        scrollToBottom();
        requestAnimationFrame(() => questionInput.focus());
      };

      const fetchConversation = async (identity) => {
        const response = await fetch('/v1/conversations/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ client_id: clientId, conversation_id: identity }),
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(typeof error.detail === 'string' ? error.detail : '历史对话暂时无法打开');
        }
        return response.json();
      };

      const renderHistory = () => {
        historyList.replaceChildren();
        historyCount.textContent = String(conversationRecords.length);
        if (!conversationRecords.length) {
          const empty = document.createElement('div');
          empty.className = 'history-empty';
          empty.textContent = '还没有本地记录。完成一次提问后会自动保存在这里。';
          historyList.appendChild(empty);
          return;
        }
        conversationRecords.forEach((record) => {
          const button = document.createElement('button');
          button.className = 'history-item';
          button.type = 'button';
          button.dataset.conversationId = record.id;
          if (record.id === conversationId) {
            button.classList.add('active');
            button.setAttribute('aria-current', 'true');
          }
          const question = document.createElement('span');
          question.className = 'history-question';
          question.textContent = record.title || '未命名对话';
          const time = document.createElement('span');
          time.className = 'history-time';
          const savedTime = formatTime(record.updated_at) || '已保存';
          const documentCopy = Number(record.document_count || 0) ? ` · ${record.document_count} 文档` : '';
          time.textContent = `${Math.floor(Number(record.message_count || 0) / 2)} 轮${documentCopy} · ${savedTime}`;
          button.append(question, time);
          button.addEventListener('click', async () => {
            const historyGeneration = ++historyRequestGeneration;
            button.disabled = true;
            button.classList.remove('error');
            button.classList.add('loading');
            time.textContent = '正在打开…';
            try {
              const restored = await fetchConversation(record.id);
              if (historyGeneration !== historyRequestGeneration) return;
              showConversation(restored);
              renderHistory();
            } catch (error) {
              if (historyGeneration !== historyRequestGeneration) return;
              button.classList.remove('loading');
              button.classList.add('error');
              time.textContent = `打开失败 · ${String(error.message || '请重试')}`;
              console.error('Failed to restore conversation', error);
            } finally {
              button.disabled = false;
              button.classList.remove('loading');
            }
          });
          historyList.appendChild(button);
        });
      };

      const loadHistory = async (restoreCurrent = true) => {
        try {
          await fetch('/v1/conversations/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id: clientId, conversation_id: conversationId }),
          });
          const response = await fetch('/v1/conversations/list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id: clientId, limit: 60 }),
          });
          if (!response.ok) throw new Error('conversation list unavailable');
          const data = await response.json();
          conversationRecords = data.data || [];
        } catch (_) {
          conversationRecords = [];
        }
        renderHistory();
        const current = conversationRecords.find((record) => record.id === conversationId);
        if (restoreCurrent && (current?.message_count || current?.document_count) && !conversation.querySelector('.message')) {
          try { showConversation(await fetchConversation(conversationId)); }
          catch (_) {}
        }
      };

      const resetChat = () => {
        requestGeneration += 1;
        activeController?.abort();
        activeController = null;
        activeUploadController?.abort();
        activeUploadController = null;
        pending = false;
        uploading = false;
        conversationId = createConversationId();
        saveConversationIdentity();
        submit.disabled = false;
        attach.disabled = false;
        questionInput.disabled = false;
        questionInput.value = '';
        currentDocuments = [];
        documentNotice = '';
        renderDocuments();
        resizeComposer();
        conversation.querySelectorAll('.message').forEach((node) => node.remove());
        welcome.hidden = false;
        chatTitle.textContent = '新的对话';
        closeSidebar();
        questionInput.focus();
      };

      document.querySelector('#new-chat').addEventListener('click', resetChat);
      attach.addEventListener('click', () => { if (!pending && !uploading) documentFile.click(); });
      documentFile.addEventListener('change', async () => {
        const file = documentFile.files?.[0];
        documentFile.value = '';
        if (!file) return;
        documentNotice = '';
        const isPdf = /\.pdf$/i.test(file.name);
        if (!/\.(md|markdown|pdf)$/i.test(file.name)) {
          documentNotice = '支持 .md、.markdown 或 .pdf 文件';
          renderDocuments();
          return;
        }
        const fileLimit = isPdf ? 20_000_000 : 10_000_000;
        if (file.size > fileLimit) {
          documentNotice = isPdf ? 'PDF 不能超过 20 MB' : '文档不能超过 10 MB';
          renderDocuments();
          return;
        }
        uploading = true;
        const generation = requestGeneration;
        const uploadController = new AbortController();
        activeUploadController?.abort();
        activeUploadController = uploadController;
        attach.disabled = true;
        submit.disabled = true;
        try {
          let content = '';
          let contentBase64 = '';
          if (isPdf) {
            documentNotice = '正在解析并整理 PDF…';
            renderDocuments();
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result || ''));
              reader.onerror = () => reject(new Error('无法读取 PDF'));
              reader.readAsDataURL(file);
            });
            contentBase64 = dataUrl.split(',', 2)[1] || '';
          } else {
            content = await file.text();
          }
          await fetch('/v1/conversations/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: uploadController.signal,
            body: JSON.stringify({ client_id: clientId, conversation_id: conversationId }),
          });
          const response = await fetch('/v1/documents/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: uploadController.signal,
            body: JSON.stringify({
              client_id: clientId,
              conversation_id: conversationId,
              filename: file.name,
              content,
              content_base64: contentBase64,
            }),
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || '文档上传失败');
          }
          if (generation !== requestGeneration) return;
          const uploadedDocument = await response.json();
          documentNotice = '';
          if (!currentDocuments.some((item) => item.id === uploadedDocument.id)) currentDocuments.push(uploadedDocument);
          renderDocuments();
          if (!conversation.querySelector('.message.user')) chatTitle.textContent = uploadedDocument.filename;
          await loadHistory(false);
          questionInput.focus();
        } catch (error) {
          if (error.name === 'AbortError' || generation !== requestGeneration) return;
          documentNotice = String(error.message || '文档上传失败');
          renderDocuments();
        } finally {
          if (generation !== requestGeneration) return;
          activeUploadController = null;
          uploading = false;
          attach.disabled = pending;
          submit.disabled = pending;
        }
      });
      document.querySelector('#menu').addEventListener('click', () => { sidebar.classList.add('open'); scrim.classList.add('open'); });
      scrim.addEventListener('click', closeSidebar);
      document.querySelectorAll('.suggestion').forEach((button) => button.addEventListener('click', () => {
        questionInput.value = button.textContent.trim();
        resizeComposer();
        form.requestSubmit();
      }));
      questionInput.addEventListener('input', resizeComposer);
      questionInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question || pending) return;
        const isNewConversation = !conversation.querySelector('.message.user');
        const generation = ++requestGeneration;
        const controller = new AbortController();
        activeController?.abort();
        activeController = controller;
        pending = true;
        submit.disabled = true;
        attach.disabled = true;
        questionInput.disabled = true;
        welcome.hidden = true;
        appendUser(question);
        if (isNewConversation) chatTitle.textContent = question.slice(0, 42);
        questionInput.value = '';
        resizeComposer();
        const { body } = assistantShell();
        const trace = createTrace([], true);
        body.appendChild(trace.details);
        scrollToBottom();
        try {
          const data = await requestAnswer(question, trace.update, controller.signal);
          if (generation !== requestGeneration) return;
          finishAssistant(body, data);
          conversationId = data.conversation_id || conversationId;
          saveConversationIdentity();
          await loadHistory(false);
        } catch (error) {
          if (error.name === 'AbortError' || generation !== requestGeneration) return;
          if (!trace.isTerminal()) trace.update('failed', { message: error.message || '未知错误' });
          appendError(body, error.message || '未知错误');
          loadHistory(false);
        } finally {
          if (generation !== requestGeneration) return;
          activeController = null;
          pending = false;
          submit.disabled = false;
          attach.disabled = false;
          questionInput.disabled = false;
          questionInput.focus();
          scrollToBottom();
        }
      });

      resizeComposer();
      loadHistory();
      loadReadiness();
    </script>
  </body>
</html>
