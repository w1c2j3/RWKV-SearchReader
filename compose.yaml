services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.server
    volumes:
      - data:/data
    expose:
      - "8790"
  worker:
    build: .
    command: rwkv-search-reader-worker
    restart: unless-stopped
    env_file: .env.server
    volumes:
      - data:/data
    stop_grace_period: 15s
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
volumes:
  data:
