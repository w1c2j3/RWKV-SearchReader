[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-search-reader"
version = "0.1.0"
description = "Forced retrieve-then-read pipeline for RWKV"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
rwkv-search-reader = "rwkv_search_reader.cli:main"
rwkv-search-reader-api = "rwkv_search_reader.api:main"
rwkv-search-reader-eval = "rwkv_search_reader.evaluation:main"
rwkv-search-reader-rag-eval = "rwkv_search_reader.rag_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
