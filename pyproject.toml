[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-search-reader"
version = "0.1.0"
description = "Forced retrieve-then-read pipeline for RWKV"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
pdf = ["docling>=2.70,<3", "pymupdf4llm>=0.0.17"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
rwkv-search-reader-worker = "rwkv_search_reader.worker:main"
rwkv-search-reader = "rwkv_search_reader.cli:main"
rwkv-search-reader-api = "rwkv_search_reader.api:main"
rwkv-search-reader-eval = "rwkv_search_reader.evaluation:main"
rwkv-search-reader-rag-eval = "rwkv_search_reader.rag_evaluation:main"
rwkv-search-reader-pdf-eval = "rwkv_search_reader.pdf_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
